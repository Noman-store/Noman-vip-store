<!DOCTYPE html>
<html>
<head>
    <title>Noman VIP Store</title>
</head>
<body style="background-color: #111827; color: white; text-align: center; font-family: Arial, sans-serif; padding: 20px;">

    <h1 style="color: gold; font-size: 45px; margin-bottom: 5px;">Noman VIP Store</h1>
    <h2>Meri Pehli VIP Website Tayyar Hai</h2>
    <p style="font-size: 18px; color: #d1d5db;">InshaAllah jald hi yahan AI-Powered Store banega.</p>
    <br>

    <!-- Search Bar -->
    <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Apni pasand ka dress ya shoes likhein..." style="padding: 12px; width: 280px; border-radius: 6px; border: none; font-size: 15px;">
    <button onclick="searchProducts()" style="padding: 12px 24px; background-color: gold; color: black; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 15px;">Search</button>

    <!-- Products Section -->
    <div style="display: flex; justify-content: center; gap: 25px; margin-top: 50px; flex-wrap: wrap;">

        <!-- Product 1 -->
        <div class="product-card" style="background-color: #1f2937; padding: 20px; border-radius: 12px; width: 230px;">
            <img src="shoes brand.png" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px;">
            <h3 style="margin: 15px 0 5px;">Black Brand Shoes</h3>
            <p style="color: gold; font-weight: bold; font-size: 18px;">Rs. 3,500</p>
            <a href="https://wa.me" target="_blank" style="display: inline-block; background-color: #22c55e; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; margin-top: 10px;">Order Now</a>
        </div>

        <!-- Product 2 -->
        <div class="product-card" style="background-color: #1f2937; padding: 20px; border-radius: 12px; width: 230px;">
            <img src="Dress vip.png" style="width: 100%; height: 180px; object-fit: cover; border-radius: 8px;">
            <h3 style="margin: 15px 0 5px;">VIP Party Suit</h3>
            <p style="color: gold; font-weight: bold; font-size: 18px;">Rs. 4,800</p>
            <a href="https://wa.me" target="_blank" style="display: inline-block; background-color: #22c55e; color: white; text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; margin-top: 10px;">Order Now</a>
        </div>

    </div>

    <!-- Search Kaam Karne Ka Code (JavaScript) -->
    <script>
        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].querySelector('h3').innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
