<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noman VIP Store</title>
</head>
<body style="background:#111827;color:#fff;font-family:Arial;margin:0;padding:20px;text-align:center;">
<h1 style="color:#FBBF24;font-size:34px;margin-bottom:5px;">Noman VIP Store</h1>
<p style="color:#9CA3AF;font-size:15px;margin-top:0;">Premium Quality • Voice AI & Live Support</p>
<div style="margin:20px auto;max-width:400px;">
<input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search shoes, suits..."
 style="width:100%;padding:12px;border-radius:25px;border:2px solid #FBBF24;background:#1F2937;color:#fff;">
</div>
<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;">
<div class="product-card" style="background:#1F2937;border:1px solid #374151;border-radius:15px;width:270px;padding:15px;">
<img src="shoes brand.png" style="width:100%;height:210px;object-fit:cover;border-radius:10px;">
<h2 style="color:#FBBF24;font-size:21px;margin:10px 0 5px;">Black Brand Shoes</h2>
<p style="color:#D1D5DB;font-size:18px;font-weight:bold;">Rs. 3,500</p>
<button type="button" onclick="orderWA('Black Brand Shoes Rs 3500')"
 style="background:#25D366;color:#fff;border:none;padding:10px 22px;border-radius:25px;font-weight:bold;cursor:pointer;">
Order on WhatsApp</button>
</div>
<div class="product-card" style="background:#1F2937;border:1px solid #374151;border-radius:15px;width:270px;padding:15px;">
<img src="Dress vip.png" style="width:100%;height:210px;object-fit:cover;border-radius:10px;">
<h2 style="color:#FBBF24;font-size:21px;margin:10px 0 5px;">VIP Party Suit</h2>
<p style="color:#D1D5DB;font-size:18px;font-weight:bold;">Rs. 4,800</p>
<button type="button" onclick="orderWA('VIP Party Suit Rs 4800')"
 style="background:#25D366;color:#fff;border:none;padding:10px 22px;border-radius:25px;font-weight:bold;cursor:pointer;">
Order on WhatsApp</button>
</div>
</div>
<p style="color:#6B7280;font-size:13px;margin:35px 0 70px;">© 2026 Noman VIP Store • 0325-1753556</p>
<button type="button" onclick="toggleChat()"
 style="position:fixed;bottom:20px;left:20px;background:#FBBF24;color:#111827;border:none;border-radius:50px;padding:13px 18px;font-weight:bold;cursor:pointer;z-index:99999;">
🤖 Voice AI Assistant</button>
<div id="aiChatBox" style="display:none;position:fixed;bottom:78px;left:20px;width:310px;background:#1F2937;border:2px solid #FBBF24;border-radius:15px;overflow:hidden;text-align:left;z-index:99999;">
<div style="background:#FBBF24;color:#111827;padding:10px 14px;font-weight:bold;display:flex;justify-content:space-between;">
<span>🤖 Noman Voice AI</span>
<div><span id="vBtn" onclick="toggleVoice()" style="cursor:pointer;margin-right:10px;">🔊</span>
<span onclick="toggleChat()" style="cursor:pointer;">✖</span></div>
</div>
<div id="chatMsgs" style="height:210px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;">
<div style="background:#374151;padding:9px;border-radius:10px;">Assalam-o-Alaikum! Main <b>Noman VIP Store</b> ka Voice AI hoon. Likh kar ya 🎤 daba kar poochein!</div>
</div>
<div style="padding:5px 8px;background:#111827;display:flex;gap:4px;">
<button type="button" onclick="qAsk('Suit price?')" style="background:#374151;color:#FBBF24;border:1px solid #FBBF24;border-radius:10px;padding:3px 7px;font-size:11px;cursor:pointer;">Suit?</button>
<button type="button" onclick="qAsk('Shoes price?')" style="background:#374151;color:#FBBF24;border:1px solid #FBBF24;border-radius:10px;padding:3px 7px;font-size:11px;cursor:pointer;">Shoes?</button>
<button type="button" onclick="qAsk('Delivery and COD?')" style="background:#374151;color:#FBBF24;border:1px solid #FBBF24;border-radius:10px;padding:3px 7px;font-size:11px;cursor:pointer;">Delivery?</button>
</div>
<div style="display:flex;border-top:1px solid #374151;background:#111827;">
<button type="button" id="micBtn" onclick="startMic()" style="background:none;border:none;color:#FBBF24;font-size:17px;padding:0 8px;cursor:pointer;">🎤</button>
<input type="text" id="uInp" onkeypress="if(event.key==='Enter')sendMsg()" placeholder="Sawal likhein..."
 style="flex:1;padding:9px 4px;border:none;background:none;color:#fff;outline:none;">
<button type="button" onclick="sendMsg()" style="background:#FBBF24;color:#111827;border:none;padding:9px 12px;font-weight:bold;cursor:pointer;">Send</button>
</div>
</div>
<script>
var vOn=true;
function orderWA(it){
var u="https://api."+"://whatsapp.com"+encodeURIComponent("Assalam-o-Alaikum! Mujhe "+it+" order karna hai.");
window.open(u,"_blank");
}
function searchProducts(){
var q=document.getElementById('searchInput').value.toLowerCase();
document.querySelectorAll('.product-card').forEach(function(c){
c.style.display=c.querySelector('h2').innerText.toLowerCase().indexOf(q)>-1?"block":"none";
});
}
function toggleChat(){
var b=document.getElementById('aiChatBox');
if(b.style.display==='none'||b.style.display===''){
b.style.display='block';
speak("Assalam o Alaikum! Noman VIP Store mein khush aamdeed.");
}else{b.style.display='none';if('speechSynthesis'in window)window.speechSynthesis.cancel();}
}
function toggleVoice(){
vOn=!vOn;document.getElementById('vBtn').innerText=vOn?'🔊':'🔇';
if(!vOn&&'speechSynthesis'in window)window.speechSynthesis.cancel();
}
function speak(t){
if(!vOn||!('speechSynthesis'in window))return;
window.speechSynthesis.cancel();
var s=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,' ').replace(/Rs\./g,'Rupees'));
s.lang='en-IN';window.speechSynthesis.speak(s);
}
function startMic(){
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert("Mic support nahi hai, type karein.");return;}
var r=new SR();r.lang='ur-PK';var m=document.getElementById('micBtn');m.innerText='🔴';r.start();
r.onresult=function(e){document.getElementById('uInp').value=e.results.item(0).item(0).transcript;m.innerText='🎤';sendMsg();};
r.onerror=function(){m.innerText='🎤';};r.onend=function(){m.innerText='🎤';};
}
function qAsk(q){document.getElementById('uInp').value=q;sendMsg();}
function aiReply(m){
m=m.toLowerCase();var a=[];
if(m.indexOf('salam')>-1||m.indexOf('hi')>-1)a.push("Walaikum Assalam! Noman VIP Store mein khush aamdeed.");
if(m.indexOf('shoe')>-1||m.indexOf('joot')>-1)a.push("<b>Black Brand Shoes</b> ki qeemat <b>Rs. 3,500</b> hai.");
if(m.indexOf('suit')>-1||m.indexOf('dress')>-1)a.push("<b>VIP Party Suit</b> ki qeemat <b>Rs. 4,800</b> hai.");
if(m.indexOf('delivery')>-1||m.indexOf('din')>-1)a.push("Delivery poore Pakistan mein <b>3 se 4 din</b> mein hoti hai.");
if(m.indexOf('cod')>-1||m.indexOf('pese')>-1||m.indexOf('pais')>-1||m.indexOf('payment')>-1)a.push("<b>Cash on Delivery (COD)</b> available hai!");
if(a.length===0)a.push("Shoes Rs. 3,500 aur VIP Suit Rs. 4,800 ka hai. Rabta WhatsApp: <b>0325-1753556</b>");
return a.join("<br>");
}
function sendMsg(){
var i=document.getElementById('uInp'),t=i.value.trim();if(!t)return;
var c=document.getElementById('chatMsgs');
c.innerHTML+='<div style="background:#FBBF24;color:#111827;padding:7px 10px;border-radius:10px;align-self:flex-end;font-weight:bold;">'+t+'</div>';
i.value='';c.scrollTop=c.scrollHeight;
setTimeout(function(){
var r=aiReply(t);
c.innerHTML+='<div style="background:#374151;padding:9px;border-radius:10px;align-self:flex-start;">'+r+'</div>';
c.scrollTop=c.scrollHeight;speak(r);
},300);
}
var Tawk_API=Tawk_API||{},Tawk_LoadStart=new Date();
(function(){
var s1=document.createElement("script"),s0=document.getElementsByTagName("script").item(0);
s1.async=true;s1.src='https://embed.'+'tawk.to/6b046c16ffbec13ca889dc04/1k84kcejk';
s1.charset='UTF-8';s1.setAttribute('crossorigin','*');s0.parentNode.insertBefore(s1,s0);
})();
</script>
</body>
</html>
