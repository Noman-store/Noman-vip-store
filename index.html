<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noman VIP Store - Voice AI</title>
</head>
<body style="background:#111827;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px;text-align:center;">
<h1 style="color:#FBBF24;font-size:34px;margin-bottom:5px;">Noman VIP Store</h1>
<p style="color:#9CA3AF;font-size:15px;margin-top:0;">Premium Quality • Voice AI & Live Support</p>
<div style="margin:20px auto;max-width:400px;">
<input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search shoes, suits..." style="width:100%;padding:12px 15px;border-radius:25px;border:2px solid #FBBF24;background:#1F2937;color:#fff;font-size:15px;outline:none;box-sizing:border-box;">
</div>
<div id="productList" style="display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:20px;">
<div class="product-card" style="background:#1F2937;border:1px solid #374151;border-radius:15px;width:270px;padding:15px;">
<img src="shoes brand.png" alt="Black Brand Shoes" style="width:100%;height:210px;object-fit:cover;border-radius:10px;">
<h2 style="color:#FBBF24;font-size:21px;margin:10px 0 5px;">Black Brand Shoes</h2>
<p style="color:#D1D5DB;font-size:18px;font-weight:bold;margin:5px 0 15px;">Rs. 3,500</p>
<button type="button" onclick="orderWA('Black Brand Shoes (Rs. 3,500)')" style="background:#25D366;color:#fff;border:none;padding:10px 22px;border-radius:25px;font-weight:bold;font-size:15px;cursor:pointer;">Order on WhatsApp</button>
</div>
<div class="product-card" style="background:#1F2937;border:1px solid #374151;border-radius:15px;width:270px;padding:15px;">
<img src="Dress vip.png" alt="VIP Party Suit" style="width:100%;height:210px;object-fit:cover;border-radius:10px;">
<h2 style="color:#FBBF24;font-size:21px;margin:10px 0 5px;">VIP Party Suit</h2>
<p style="color:#D1D5DB;font-size:18px;font-weight:bold;margin:5px 0 15px;">Rs. 4,800</p>
<button type="button" onclick="orderWA('VIP Party Suit (Rs. 4,800)')" style="background:#25D366;color:#fff;border:none;padding:10px 22px;border-radius:25px;font-weight:bold;font-size:15px;cursor:pointer;">Order on WhatsApp</button>
</div>
</div>
<p style="color:#6B7280;font-size:13px;margin:35px 0 70px;">© 2026 Noman VIP Store • WhatsApp: 0325-1753556</p>
<button type="button" onclick="toggleChat()" style="position:fixed;bottom:20px;left:20px;background:#FBBF24;color:#111827;border:none;border-radius:50px;padding:13px 18px;font-size:15px;font-weight:bold;cursor:pointer;z-index:99999;">🤖 Voice AI Assistant</button>
<div id="aiChatBox" style="display:none;position:fixed;bottom:78px;left:20px;width:315px;max-width:90vw;background:#1F2937;border:2px solid #FBBF24;border-radius:15px;overflow:hidden;text-align:left;z-index:99999;">
<div style="background:#FBBF24;color:#111827;padding:10px 14px;font-weight:bold;display:flex;justify-content:space-between;align-items:center;">
<span>🤖 Noman Store Voice AI</span>
<div><span id="voiceToggle" onclick="toggleVoice()" style="cursor:pointer;font-size:17px;margin-right:10px;">🔊</span><span onclick="toggleChat()" style="cursor:pointer;font-size:17px;">✖</span></div>
</div>
<div id="chatMessages" style="height:220px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;">
<div style="background:#374151;color:#fff;padding:9px;border-radius:10px;max-width:85%;">Assalam-o-Alaikum! Main <b>Noman VIP Store</b> ka Voice AI hoon. Likh kar ya 🎤 Mic daba kar poochein!</div>
</div>
<div style="padding:5px 8px;background:#111827;display:flex;gap:4px;flex-wrap:wrap;">
<button type="button" onclick="quickAsk('Suit ki qeemat kya hai?')" style="background:#374151;color:#FBBF24;border:1px solid #FBBF24;border-radius:10px;padding:3px 7px;font-size:11px;cursor:pointer;">Suit Price?</button>
<button type="button" onclick="quickAsk('Shoes kitne ke hain?')" style="background:#374151;color:#FBBF24;border:1px solid #FBBF24;border-radius:10px;padding:3px 7px;font-size:11px;cursor:pointer;">Shoes Price?</button>
<button type="button" onclick="quickAsk('Delivery aur payment?')" style="background:#374151;color:#FBBF24;border:1px solid #FBBF24;border-radius:10px;padding:3px 7px;font-size:11px;cursor:pointer;">Delivery?</button>
</div>
<div style="display:flex;border-top:1px solid #374151;background:#111827;align-items:center;">
<button type="button" id="micBtn" onclick="startVoiceInput()" style="background:transparent;border:none;color:#FBBF24;font-size:17px;padding:0 8px;cursor:pointer;">🎤</button>
<input type="text" id="userInput" onkeypress="if(event.key==='Enter')sendMessage()" placeholder="Sawal likhein ya bolein..." style="flex:1;padding:9px 4px;border:none;background:transparent;color:#fff;outline:none;font-size:13px;">
<button type="button" onclick="sendMessage()" style="background:#FBBF24;color:#111827;border:none;padding:9px 12px;font-weight:bold;cursor:pointer;">Send</button>
</div>
</div>
<script>
var voiceEnabled=true;
function orderWA(item){
var msg=encodeURIComponent("Assalam-o-Alaikum! Mujhe "+item+" order karna hai.");
window.open("https://whatsapp.com"+msg,"_blank");
}
function searchProducts(){
var input=document.getElementById('searchInput').value.toLowerCase();
document.querySelectorAll('.product-card').forEach(function(c){
c.style.display=c.querySelector('h2').innerText.toLowerCase().indexOf(input)>-1?"block":"none";
});
}
function toggleChat(){
var box=document.getElementById('aiChatBox');
if(box.style.display==='none'||box.style.display===''){
box.style.display='block';
speakText("Assalam o Alaikum! Noman VIP Store mein khush aamdeed. Main aapki kya madad kar sakta hoon?");
}else{box.style.display='none';if('speechSynthesis'in window)window.speechSynthesis.cancel();}
}
function toggleVoice(){
voiceEnabled=!voiceEnabled;
document.getElementById('voiceToggle').innerText=voiceEnabled?'🔊':'🔇';
if(!voiceEnabled&&'speechSynthesis'in window)window.speechSynthesis.cancel();
}
function speakText(t){
if(!voiceEnabled||!('speechSynthesis'in window))return;
window.speechSynthesis.cancel();
var s=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,' ').replace(/Rs\./g,'Rupees'));
s.lang='en-IN';s.rate=0.95;window.speechSynthesis.speak(s);
}
function startVoiceInput(){
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){alert("Mic support nahi hai, type karke poochein.");return;}
var r=new SR();r.lang='ur-PK';var b=document.getElementById('micBtn');b.innerText='🔴';r.start();
r.onresult=function(e){document.getElementById('userInput').value=e.results.item(0).item(0).transcript;b.innerText='🎤';sendMessage();};
r.onerror=function(){b.innerText='🎤';};r.onend=function(){b.innerText='🎤';};
}
function quickAsk(q){document.getElementById('userInput').value=q;sendMessage();}
function getAIReply(m){
m=m.toLowerCase();var res=[];
if(m.indexOf('salam')>-1||m.indexOf('hi')>-1||m.indexOf('hello')>-1)res.push("Walaikum Assalam! Noman VIP Store mein khush aamdeed.");
if(m.indexOf('shoe')>-1||m.indexOf('joot')>-1)res.push("<b>Black Brand Shoes</b> ki qeemat <b>Rs. 3,500</b> hai.");
if(m.indexOf('suit')>-1||m.indexOf('dress')>-1)res.push("<b>VIP Party Suit</b> ki qeemat <b>Rs. 4,800</b> hai.");
if((m.indexOf('price')>-1||m.indexOf('qeemat')>-1||m.indexOf('ketne')>-1||m.indexOf('kitne')>-1)&&m.indexOf('shoe')===-1&&m.indexOf('suit')===-1)res.push("Shoes <b>Rs. 3,500</b> aur VIP Suit <b>Rs. 4,800</b> ka hai.");
if(m.indexOf('delivery')>-1||m.indexOf('dilver')>-1||m.indexOf('din')>-1)res.push("Poore Pakistan mein delivery <b>3 se 4 din</b> mein hoti hai.");
if(m.indexOf('pese')>-1||m.indexOf('pais')>-1||m.indexOf('payment')>-1||m.indexOf('cod')>-1)res.push("<b>Cash on Delivery (COD)</b> available hai, ya WhatsApp <b>0325-1753556</b> par rabta karein.");
return res.length>0?res.join("<br><br>"):"Mazeed maloomat ke liye WhatsApp <b>0325-1753556</b> ya Right kone mein Live Chat par rabta karein!";
}
function sendMessage(){
var inp=document.getElementById('userInput'),t=inp.value.trim();if(!t)return;
var ca=document.getElementById('chatMessages');
ca.innerHTML+='<div style="background:#FBBF24;color:#111827;padding:7px 10px;border-radius:10px;align-self:flex-end;max-width:80%;font-weight:bold;">'+t+'</div>';
inp.value='';ca.scrollTop=ca.scrollHeight;
setTimeout(function(){
var rep=getAIReply(t);
ca.innerHTML+='<div style="background:#374151;color:#fff;padding:9px;border-radius:10px;align-self:flex-start;max-width:85%;">'+rep+'</div>';
ca.scrollTop=ca.scrollHeight;speakText(rep);
},350);
}
var Tawk_API=Tawk_API||{},Tawk_LoadStart=new Date();
(function(){var s1=document.createElement("script"),s0=document.getElementsByTagName("script").item(0);s1.async=true;s1.src='https://tawk.to;})();
