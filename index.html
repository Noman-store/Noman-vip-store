<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noman VIP Store</title>
</head>
<body style="background-color: #111827; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; text-align: center;">

    <!-- Header -->
    <h1 style="color: #FBBF24; font-size: 36px; margin-bottom: 5px;">Noman VIP Store</h1>
    <p style="color: #9CA3AF; font-size: 16px; margin-top: 0;">Premium Quality • Fast Delivery Across Pakistan</p>

    <!-- Search Bar -->
    <div style="margin: 25px auto; max-width: 400px;">
        <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="Search shoes, suits..." 
               style="width: 100%; padding: 12px 15px; border-radius: 25px; border: 2px solid #FBBF24; background-color: #1F2937; color: white; font-size: 16px; outline: none; box-sizing: border-box;">
    </div>

    <!-- Products Container -->
    <div id="productList" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; margin-top: 20px;">

        <!-- Product 1 -->
        <div class="product-card" style="background-color: #1F2937; border: 1px solid #374151; border-radius: 15px; width: 280px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
            <img src="shoes brand.png" alt="Black Brand Shoes" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px;">
            <h2 style="color: #FBBF24; font-size: 22px; margin: 12px 0 5px;">Black Brand Shoes</h2>
            <p style="color: #D1D5DB; font-size: 18px; font-weight: bold; margin: 5px 0 15px;">Rs. 3,500</p>
            <a href="https://wa.me." target="_blank" 
               style="display: inline-block; background-color: #25D366; color: white; text-decoration: none; padding: 10px 22px; border-radius: 25px; font-weight: bold; font-size: 15px;">
               Order on WhatsApp
            </a>
        </div>

        <!-- Product 2 -->
        <div class="product-card" style="background-color: #1F2937; border: 1px solid #374151; border-radius: 15px; width: 280px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);">
            <img src="Dress vip.png" alt="VIP Party Suit" style="width: 100%; height: 220px; object-fit: cover; border-radius: 10px;">
            <h2 style="color: #FBBF24; font-size: 22px; margin: 12px 0 5px;">VIP Party Suit</h2>
            <p style="color: #D1D5DB; font-size: 18px; font-weight: bold; margin: 5px 0 15px;">Rs. 4,800</p>
            <a href="https://wa.me." target="_blank" 
               style="display: inline-block; background-color: #25D366; color: white; text-decoration: none; padding: 10px 22px; border-radius: 25px; font-weight: bold; font-size: 15px;">
               Order on WhatsApp
            </a>
        </div>

    </div>

    <!-- Footer -->
    <p style="color: #6B7280; font-size: 14px; margin-top: 40px;">© 2026 Noman VIP Store • AI-Powered Online Shop</p>

    <!-- Search Filter Script -->
    <script>
        function searchProducts() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('product-card');
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h2')[0].innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "block" : "none";
            }
        }
    </script>

    <!--Start of Tawk.to Script-->
    <script type="text/javascript">
    var Tawk_API=Tawk_API||{}, Tawk_LoadStart=new Date();
    (function(){
    var s1=document.createElement("script"),s0=document.getElementsByTagName("script")[0];
    s1.async=true;
    s1.src='https://embed.tawk.to/6b046c16ffbec13ca889dc04/1k84kcejk';
    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);
    })();
    </script>
    <!--End of Tawk.to Script-->

</body>
</html>
